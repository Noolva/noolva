<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="36" y1="32" x2="220" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1220" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="32" y="32" width="192" height="192" rx="48" fill="url(#bg)"/>
  </g>

  <!-- Database/Server icon with console terminal -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Database cylinder -->
    <ellipse cx="128" cy="100" rx="48" ry="12"/>
    <rect x="80" y="100" width="96" height="64" rx="0" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="128" cy="164" rx="48" ry="12"/>
    <!-- Horizontal lines on database -->
    <line x1="88" y1="124" x2="168" y2="124" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    <line x1="88" y1="140" x2="168" y2="140" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    
    <!-- Terminal window -->
    <rect x="76" y="180" width="104" height="60" rx="8" fill="#0B1220" opacity="0.85"/>
    <rect x="82" y="186" width="92" height="6" rx="2" fill="#6B7280"/>
    <!-- Terminal prompt -->
    <text x="86" y="210" font-family="monospace" font-size="10" fill="#10B981" opacity="0.9">$</text>
    <rect x="92" y="204" width="8" height="12" fill="#10B981" opacity="0.9"/>
    <!-- Terminal cursor -->
    <rect x="102" y="204" width="4" height="12" fill="#FFFFFF"/>
  </g>
</svg>
