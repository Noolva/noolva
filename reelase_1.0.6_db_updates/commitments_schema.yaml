# ============================================================================
# Noolva Console Schema Definition: commitments
# Model Name: commitments
# Display Name: Commitments
# Table Name: commitments
# Description: Recurring financial obligations (bills, fund reserves, subscriptions, EMIs)
# ============================================================================

- field_name: commitment_id
  display_name: Commitment ID
  type_code: auto_number
  is_required: false
  is_unique: false
  is_primary_key: true
  order_no: 1
  field_config_json: {}

- field_name: title
  display_name: Commitment Title
  type_code: text
  is_required: true
  is_unique: false
  is_primary_key: false
  order_no: 2
  field_config_json:
    max_length: 200

- field_name: commitment_type
  display_name: Commitment Type
  type_code: single_choice
  is_required: true
  is_unique: false
  is_primary_key: false
  default_value: bill_expense
  order_no: 3
  field_config_json:
    options_mode: custom_collection
    options:
      - label: "Bill / Direct Expense"
        value: bill_expense
      - label: "Savings Fund Allocation"
        value: fund_reserve
      - label: "Subscription / Service"
        value: subscription
      - label: "Loan EMI / Repayment"
        value: loan_emi
      - label: "Other Obligation"
        value: other

- field_name: expense_account_id
  display_name: Expense Account
  type_code: relation
  is_required: false
  is_unique: false
  is_primary_key: false
  order_no: 4
  field_config_json:
    target_model: accounts
    target_field: account_id
    relation_type: many_to_one
    target_model_id: 76

- field_name: fund_id
  display_name: Linked Savings Fund
  type_code: relation
  is_required: false
  is_unique: false
  is_primary_key: false
  order_no: 5
  field_config_json:
    target_model: funds
    target_field: fund_id
    relation_type: many_to_one
    target_model_id: 77

- field_name: payment_account_id
  display_name: Preferred Payment Account
  type_code: relation
  is_required: false
  is_unique: false
  is_primary_key: false
  order_no: 6
  field_config_json:
    target_model: accounts
    target_field: account_id
    relation_type: many_to_one
    target_model_id: 76

- field_name: beneficiary_business_id
  display_name: Payee / Beneficiary Store
  type_code: relation
  is_required: false
  is_unique: false
  is_primary_key: false
  order_no: 7
  field_config_json:
    target_model: businesses
    target_field: business_id
    relation_type: many_to_one
    target_model_id: 51

- field_name: frequency
  display_name: Recurrence Frequency
  type_code: single_choice
  is_required: true
  is_unique: false
  is_primary_key: false
  default_value: monthly
  order_no: 8
  field_config_json:
    options_mode: custom_collection
    options:
      - label: "Monthly"
        value: monthly
      - label: "Weekly"
        value: weekly
      - label: "Bi-Weekly"
        value: biweekly
      - label: "Quarterly"
        value: quarterly
      - label: "Yearly"
        value: yearly

- field_name: due_day
  display_name: Due Day of Month
  type_code: number
  is_required: true
  is_unique: false
  is_primary_key: false
  default_value: "1"
  order_no: 9
  field_config_json:
    min_value: 1
    max_value: 31

